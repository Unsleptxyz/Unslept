name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problems must be reported privately. See SECURITY.md."
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Website or app, "@unslept/sdk", "@unslept/mcp", Python SDK, Contracts, Docs]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include transaction hashes, package versions or URLs where relevant. Never include private keys.
  - type: input
    id: version
    attributes:
      label: Version or commit
