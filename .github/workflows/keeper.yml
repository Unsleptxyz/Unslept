name: keeper

# Every 10 minutes on Solana: repay agent debt from liquid USDC, redeem just enough of an agent's Kamino position to
# clear the rest, and close payment records older than 24 hours (rent returns to whoever paid it).
# The keeper key is derived from DEPLOYER_PRIVATE_KEY; it needs a little SOL for fees.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Keeper pass
        working-directory: solana
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          RPC: ${{ secrets.SOLANA_MAINNET_RPC || 'https://api.mainnet-beta.solana.com' }}
        run: |
          if [ -z "$DEPLOYER_PRIVATE_KEY" ]; then echo "DEPLOYER_PRIVATE_KEY secret is not set; skipping."; exit 0; fi
          npm install --no-audit --no-fund --no-save @solana/web3.js@1 > /dev/null 2>&1
          node scripts/derive-keys.mjs /tmp/keys > /dev/null
          node scripts/keeper.mjs /tmp/keys
