name: probe

# Read-only chain probe. Prints recent Pons factory launch logs so the launch detector can be checked against real data.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe
        run: |
          mkdir -p out && cd out
          cat > p.mjs <<'JS'
          const RPC = "https://rpc.mainnet.chain.robinhood.com";
          const call = async (method, params) => (await (await fetch(RPC, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params }) })).json());
          const head = BigInt((await call("eth_blockNumber", [])).result);
          const F = ["0xA5aAb3F0c6EeadF30Ef1D3Eb997108E976351feB","0x0c37a24F5D23A486FA692d1500881d698B1F77a4","0x7ed598bcef8bd9edd8c97a195c6d13f40801ec7e","0x1f7d7550b1b028f7571e69a784071f0205fd2efa"];
          console.log("head", head);
          for (const f of F) {
            const r = await call("eth_getLogs", [{ address: f, fromBlock: "0x" + (head - 50000n).toString(16), toBlock: "0x" + head.toString(16) }]);
            if (r.error) { console.log(f, "ERROR", JSON.stringify(r.error)); continue; }
            const byTopic = {};
            for (const l of r.result) { const k = l.topics[0] + " n=" + l.topics.length; byTopic[k] = (byTopic[k] || 0) + 1; }
            console.log(f, "logs", r.result.length, JSON.stringify(byTopic));
            const launch = r.result.find((l) => l.topics.length >= 3);
            if (launch) {
              const tx = (await call("eth_getTransactionByHash", [launch.transactionHash])).result;
              console.log("  sample topics", JSON.stringify(launch.topics), "tx.from", tx?.from);
              const tok = "0x" + launch.topics[1].slice(26);
              const sym = (await call("eth_call", [{ to: tok, data: "0x95d89b41" }, "latest"])).result;
              console.log("  topic1 symbol raw", sym?.slice(0, 200));
            }
          }
          JS
          node p.mjs | tee probe.txt
      - name: Publish
        run: |
          cd out && rm -f p.mjs
          git init -q -b probe
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m probe
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
