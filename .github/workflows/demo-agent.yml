# Robinhood Chain demo agent, retired with the move to Solana. Manual runs only.
name: demo-agent

# The official demo agent: pays verified x402 Directory endpoints so the live feed shows real settlements.
# The agent account is created by setup-demo-agent.yml (address in ops/demo-agent.txt) and signed by the keeper key.
# DEMO_AGENT_ACCOUNT and DEMO_AGENT_SIGNER_KEY secrets override both. Skips quietly when nothing is set up.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-agent
  cancel-in-progress: false

jobs:
  pay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEMO_AGENT_ACCOUNT_SECRET: ${{ secrets.DEMO_AGENT_ACCOUNT }}
      DEMO_AGENT_SIGNER_KEY: ${{ secrets.DEMO_AGENT_SIGNER_KEY || secrets.KEEPER_PRIVATE_KEY }}
      DEMO_AGENT_BUDGET: "20000"
      UNSLEPT_CHAIN_ID: "4663"
      UNSLEPT_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}
      UNSLEPT_USDG: "0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168"
      UNSLEPT_ROUTER: "0x1FeAB3B8f88FB0667B686fDCB0206194e88c984b"
      UNSLEPT_BUFFERS: "0xcD853fb30eCe3134Cf21e2f47B9e23eaf965F40D"
    steps:
      - uses: actions/checkout@v4
      - name: Check setup
        id: gate
        run: |
          ACCT="$DEMO_AGENT_ACCOUNT_SECRET"
          if [ -z "$ACCT" ] && [ -f ops/demo-agent.txt ] && grep -q "agent_deployed=yes" ops/demo-agent.txt; then ACCT=$(grep "^agent_account=" ops/demo-agent.txt | cut -d= -f2); fi
          if [ -z "$ACCT" ] || [ -z "$DEMO_AGENT_SIGNER_KEY" ]; then echo "Demo agent is not set up, skipping."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "DEMO_AGENT_ACCOUNT=$ACCT" >> "$GITHUB_ENV"; echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
      - name: Pay
        if: steps.gate.outputs.run == 'true'
        working-directory: packages/sdk-ts
        run: |
          npm install --no-audit --no-fund > /dev/null
          node --import tsx scripts/demo-agent.ts
