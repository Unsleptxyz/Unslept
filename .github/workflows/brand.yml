name: brand

# Renders the social images in brand/ with the site fonts and pushes them to the "brand-assets" branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render
        working-directory: brand
        run: |
          npm init -y > /dev/null
          npm install --no-save --no-audit --no-fund @fontsource/instrument-serif @fontsource/inter @fontsource/ibm-plex-mono playwright@1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          node render.mjs
      - name: Publish
        run: |
          cd brand/out
          git init -q -b brand-assets
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Brand assets"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" brand-assets
