name: publish-packages

# Publishes @unslept/sdk and @unslept/mcp to npm, and unslept to PyPI.
# Setup once:
#   npm:  create the "unslept" org on npmjs.com, make an automation token, save it as repo secret NPM_TOKEN.
#   PyPI: on pypi.org add a pending trusted publisher: project "unslept", owner "Unsleptxyz", repo "Unslept",
#         workflow "publish.yml", environment "pypi". No token needed.
# Run: Actions > publish-packages > Run workflow. "check" builds and tests everything and checks the names, without publishing.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to publish"
        type: choice
        options: [check, all, npm, pypi]
        default: check

permissions:
  contents: read

jobs:
  check:
    if: inputs.target == 'check'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build, test and pack
        shell: bash {0}
        run: |
          out=ops/publish-check.txt; mkdir -p ops
          {
            echo "# Publish check $(date -u +%FT%TZ)"
            (cd packages/sdk-ts && npm install --no-audit --no-fund >/dev/null 2>&1 && npm test >/dev/null 2>&1 && npm run build >/dev/null 2>&1 && echo "sdk-ts build+test ok" && npm pack --dry-run 2>&1 | grep -E "Tarball Contents|total files|package size" ) || echo "sdk-ts FAILED"
            (cd packages/mcp && npm install --no-audit --no-fund >/dev/null 2>&1 && npm test >/dev/null 2>&1 && npm run build >/dev/null 2>&1 && echo "mcp build+test ok" && npm pack --dry-run 2>&1 | grep -E "total files|package size") || echo "mcp FAILED"
            (cd packages/sdk-py && python -m pip install -q build pytest && python -m pytest -q tests >/dev/null && python -m build >/dev/null 2>&1 && echo "sdk-py build+test ok: $(ls dist | tr '\n' ' ')") || echo "sdk-py FAILED"
            for n in @unslept/sdk @unslept/mcp; do s=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/${n/\//%2f}"); echo "npm $n: $([ "$s" = 404 ] && echo available || echo "TAKEN or exists ($s)")"; done
            s=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/-/org/unslept/package"); echo "npm org unslept lookup: $s"
            s=$(curl -s -o /dev/null -w "%{http_code}" https://pypi.org/pypi/unslept/json); echo "pypi unslept: $([ "$s" = 404 ] && echo available || echo "TAKEN or exists ($s)")"
          } > $out
          cat $out
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add ops/publish-check.txt; git commit -m "Record publish check" || exit 0
          git pull --rebase && git push

  npm:
    if: inputs.target == 'all' || inputs.target == 'npm'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Build and test
        run: |
          (cd packages/sdk-ts && npm install --no-audit --no-fund && npm test && npm run build)
          (cd packages/mcp && npm install --no-audit --no-fund && npm test && npm run build)
          SDKV=$(node -p "require('./packages/sdk-ts/package.json').version")
          cd packages/mcp && node -e "const p=require('./package.json');p.dependencies['@unslept/sdk']='^$SDKV';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\\n')"
      - name: Publish
        shell: bash {0}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash ops/npm-publish.sh
      - name: Record result
        if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout -- packages/mcp/package.json 2>/dev/null || true
          git add ops/npm-publish.txt; git commit -m "Record npm publish result" || exit 0
          git pull --rebase && git push

  pypi:
    if: inputs.target == 'all' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test and build
        working-directory: packages/sdk-py
        run: |
          python -m pip install --upgrade build pytest
          python -m pytest -q tests
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/sdk-py/dist
          skip-existing: true
