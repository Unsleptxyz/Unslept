name: setup-demo-agent

# Creates the official demo agent account. Owner: the deployer wallet (DEPLOYER_PRIVATE_KEY). Signer: the keeper
# wallet (KEEPER_PRIVATE_KEY), which already holds ETH for gas. Policy: 0.02 USDG per call, 1 USDG per day.
# "check" prints balances and the agent address. "create" creates the account. "fund" also sends USDG from the deployer.
# Writes ops/demo-agent.txt (addresses and balances only, never keys).
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [check, create, fund]
        default: check
      fund_usdg:
        description: "USDG to send from the deployer when action is fund (whole units)"
        default: "3"

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RPC: ${{ secrets.ROBINHOOD_RPC_URL || 'https://rpc.mainnet.chain.robinhood.com' }}
      FACTORY: "0xCa7D38A833BFaCBE22E787f967552A78b07C1c77"
      USDG: "0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168"
      DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
      KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Setup
        shell: bash {0}
        run: |
          set -u
          mkdir -p ops; out=ops/demo-agent.txt
          OWNER=$(cast wallet address --private-key "$DEPLOYER_PRIVATE_KEY")
          SIGNER=$(cast wallet address --private-key "$KEEPER_PRIVATE_KEY")
          SALT=$(cast keccak "unslept-demo-agent")
          AGENT=$(cast call $FACTORY "predictAddress(address,bytes32)(address)" $OWNER $SALT --rpc-url $RPC)
          code=$(cast code $AGENT --rpc-url $RPC)
          if [ "${{ inputs.action }}" != "check" ] && [ "$code" = "0x" ]; then
            echo "Creating agent account $AGENT"
            cast send $FACTORY "createAccount(address,(uint128,uint128),bytes32)" $SIGNER "(20000,1000000)" $SALT \
              --private-key "$DEPLOYER_PRIVATE_KEY" --rpc-url $RPC > /tmp/create.txt 2>&1 || { tail -5 /tmp/create.txt; }
            code=$(cast code $AGENT --rpc-url $RPC)
          fi
          if [ "${{ inputs.action }}" = "fund" ] && [ "$code" != "0x" ]; then
            AMT=$(( ${{ inputs.fund_usdg }} * 1000000 ))
            echo "Sending $AMT atomic USDG to $AGENT"
            cast send $USDG "transfer(address,uint256)" $AGENT $AMT --private-key "$DEPLOYER_PRIVATE_KEY" --rpc-url $RPC > /tmp/fund.txt 2>&1 || tail -5 /tmp/fund.txt
          fi
          bal() { cast call $USDG "balanceOf(address)(uint256)" $1 --rpc-url $RPC | awk '{print $1}'; }
          {
            echo "# Demo agent $(date -u +%FT%TZ) action=${{ inputs.action }}"
            echo "agent_account=$AGENT"
            echo "agent_deployed=$([ "$code" = "0x" ] && echo no || echo yes)"
            echo "owner=$OWNER eth=$(cast balance $OWNER --ether --rpc-url $RPC) usdg_atomic=$(bal $OWNER)"
            echo "signer=$SIGNER eth=$(cast balance $SIGNER --ether --rpc-url $RPC) usdg_atomic=$(bal $SIGNER)"
            echo "agent usdg_atomic=$(bal $AGENT)"
            echo "policy=perCall 20000, daily 1000000"
          } > $out
          cat $out
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add ops/demo-agent.txt && git commit -q -m "ops: demo agent status" && git push -q || echo "nothing to commit"
