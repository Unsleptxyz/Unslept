[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "unslept"
version = "0.2.0"
description = "Pay x402 paywalls in USDC on Solana from an Unslept agent account."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.urls]
Homepage = "https://www.unslept.xyz/docs"
Source = "https://github.com/Unsleptxyz/Unslept"

[project.optional-dependencies]
solana = ["solders>=0.21"]
langchain = ["langchain-core>=0.3"]

[tool.hatch.build.targets.wheel]
packages = ["unslept"]
