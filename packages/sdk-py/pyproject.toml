[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "unslept"
version = "0.1.0"
description = "Pay x402 paywalls from an Unslept agent account on Robinhood Chain."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.urls]
Homepage = "https://unslept-o29g.vercel.app/docs"
Source = "https://github.com/Unsleptxyz/Unslept"

[project.optional-dependencies]
web3 = ["web3>=7,<8", "eth-account>=0.13"]
langchain = ["langchain-core>=0.3"]

[tool.hatch.build.targets.wheel]
packages = ["unslept"]
